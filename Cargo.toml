[package]
name = "rusty_rose"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1"
hound = "3"
rustfft = "6"
num-complex = "0.4"
ndarray = "0.15"
log = "0.4.29"
approx = "0.5.1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "feature_benchmarks"
harness = false
